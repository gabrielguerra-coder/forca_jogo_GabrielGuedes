<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo Da Forca</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
        <h1 class="titulo">Jogo da forca🪢</h1><br>
        <div class="desenho-forca">
            <svg width="200" height="250" viewBox="0 0 200 250">

                <!-- Estrutura da forca -->
                <line x1="20" y1="230" x2="120" y2="230" stroke="#8B5E3C" stroke-width="8"/>
                <line x1="60" y1="230" x2="60" y2="20" stroke="#8B5E3C" stroke-width="8"/>
                <line x1="60" y1="20" x2="150" y2="20" stroke="#8B5E3C" stroke-width="8"/>
                <line x1="150" y1="20" x2="150" y2="50" stroke="#8B5E3C" stroke-width="5"/>

                <!-- Cabeça -->
                <circle id="parte1" cx="150" cy="70" r="20"
                    stroke="white" stroke-width="4" fill="none" style="display:none"/>

                <!-- Corpo -->
                <line id="parte2" x1="150" y1="90" x2="150" y2="150"
                    stroke="white" stroke-width="4" style="display:none"/>

                <!-- Braço esquerdo -->
                <line id="parte3" x1="150" y1="110" x2="120" y2="135"
                    stroke="white" stroke-width="4" style="display:none"/>

                <!-- Braço direito -->
                <line id="parte4" x1="150" y1="110" x2="180" y2="135"
                    stroke="white" stroke-width="4" style="display:none"/>

                <!-- Perna esquerda -->
                <line id="parte5" x1="150" y1="150" x2="125" y2="190"
                    stroke="white" stroke-width="4" style="display:none"/>

                <!-- Perna direita -->
                <line id="parte6" x1="150" y1="150" x2="175" y2="190"
                    stroke="white" stroke-width="4" style="display:none"/>

            </svg>
        </div>
        <p class="jogo">Forca: <strong id="palavra"></strong></p><br>
        <p class="vidas">Vidas: <span id="vidas"></span></p><br>
        <p class="descartados">Letras Inválidas: <span id="descartados"></span></p>

        <input type="text" id="campo-Digitado" placeholder="Digite uma letra" maxlength="1"><br>
        <button id="btn-verificar" class="botao">Verificar letra</button>

        <div id="status"></div>

        <script src="script.js"></script>
</body>
</html>
